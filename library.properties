name=Guard_ESP
version=1.2.0
author=Olivier FOURNET <olivier.fournet@free.fr>
maintainer=Olivier FOURNET <olivier.fournet@free.fr>
sentence=Protection anti-OOM, anti-freeze et anti-rafale pour ESP8266 et ESP32 (header-only, zéro allocation).
paragraph=Plafond de connexions TCP avant toute allocation (503 sans String) + fenêtre glissante pondérée (HTTP 429 + Retry-After + X-RateLimit-*), backpressure mémoire XON/XOFF sur le heap ET le plus gros bloc contigu, plafond de concurrence (503), garde de durée par requête, garde de démarrage, watchdog d'inactivité, compteurs par route. Adaptateurs pour Server_MCP, ESP8266WebServer/WebServer et Print streamé sans String. Profils ESP8266/ESP32 et auto-calibration.
category=Other
