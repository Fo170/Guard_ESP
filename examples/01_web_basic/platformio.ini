; Guard_ESP — exemple 1 : web + page streamée
; Build : pio run -e esp12e     (ESP8266)
;         pio run -e esp32dev   (ESP32)
[env]
framework      = arduino
lib_extra_dirs = ../../../
build_flags    = -Wall -Wextra

[env:esp12e]
platform = espressif8266
board    = esp12e

[env:esp32dev]
platform = espressif32
board    = esp32dev
