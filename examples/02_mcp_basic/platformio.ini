; Guard_ESP — exemple 2 : intégration Server_MCP
; Build : pio run -e esp12e
;         pio run -e esp32dev
[env]
framework      = arduino
lib_extra_dirs = ../../../
build_flags    = -Wall -Wextra
lib_deps       = bblanchon/ArduinoJson@^7.0.0
                 https://github.com/Fo170/Server_MCP.git@^1.5.0

[env:esp12e]
platform = espressif8266
board    = esp12e

[env:esp32dev]
platform = espressif32
board    = esp32dev
